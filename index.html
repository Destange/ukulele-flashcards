/* ── CHORD DETAIL ── */
function renderChordDetail(root){
  var ids = app.detailIds;

  var div=document.createElement('div');
  div.className='detail-screen fadein';

  // ── Top (statique) ──
  var top=document.createElement('div');
  top.className='detail-top';
  var counterSpan = document.createElement('span');
  counterSpan.className = 'detail-counter';
  // Titre : "Dictionnaire" depuis le référentiel, nom du mode depuis une preview
  var title = 'Dictionnaire';
  if (app.detailContext === 'mode-preview' && MODES[app.modeId]) {
    title = MODES[app.modeId].icon + ' ' + MODES[app.modeId].name;
  }
  top.innerHTML =
    '<button class="btn-nav-back" id="dBack" aria-label="Retour">'+ICON_BACK+'<span class="btn-nav-label">Retour</span></button>'+
    '<h2 class="ref-h">'+title+'</h2>';
  top.appendChild(counterSpan);
  div.appendChild(top);

  // ── Card stack (effet deck) ──
  var stack=document.createElement('div');
  stack.className='detail-card-stack';
  var currentCard=document.createElement('div');
  currentCard.className='detail-card';
  if (!_chordDetailNav) currentCard.classList.add('popin');
  stack.appendChild(currentCard);
  div.appendChild(stack);

  // ── Légende (statique) ──
  var leg=document.createElement('div');
  leg.className='detail-legend';
  [['1','index'],['2','majeur'],['3','annulaire'],['4','auriculaire']].forEach(function(p){
    leg.innerHTML+='<span><div class="det-dot">'+p[0]+'</div>'+p[1]+'</span>';
  });
  div.appendChild(leg);

  // ── Boutons prev/next (statiques, juste disabled qui change) ──
  var nav=document.createElement('div');
  nav.className='detail-nav';
  var bPrev=document.createElement('button');
  bPrev.className='btn-nav';
  bPrev.innerHTML='<span class="btn-nav-ic prev">'+ICON_BACK+'</span><span>Précédent</span>';
  var bNext=document.createElement('button');
  bNext.className='btn-nav';
  bNext.innerHTML='<span>Suivant</span><span class="btn-nav-ic next">'+ICON_ARROW_RIGHT+'</span>';
  nav.appendChild(bPrev);
  nav.appendChild(bNext);
  div.appendChild(nav);

  root.appendChild(div);

  // ── Helpers ──
  function buildCardHTML(c){
    var m = chordMastery(c.id);
    var pct = Math.round(m*100);
    var col = pct===100 ? '#12B558' : m>=0.75 ? '#7A9A35' : m>=0.4 ? '#C49225' : '#C04848';
    var pctLabel = pct===100 ? '✔️' : pct+'%';
    return '<div class="detail-name">'+c.name+'</div>'+
      (c.sub ? '<div class="detail-sub">'+c.sub+'</div>' : '')+
      '<div class="detail-diag">'+drawDiagram(c,'lg')+'</div>'+
      '<div class="detail-prog-row">'+
        '<div class="detail-bar"><div class="detail-fill" style="width:'+pct+'%;background:'+col+'"></div></div>'+
        '<div class="detail-pct">'+pctLabel+' maîtrisé</div>'+
      '</div>';
  }
  function syncUI(idx){
    counterSpan.textContent = (idx+1)+' / '+ids.length;
    bPrev.disabled = (idx === 0);
    bNext.disabled = (idx === ids.length - 1);
    if (_historyReady && history.state && history.state.screen === 'chord-detail') {
      var st = Object.assign({}, history.state, { detailIdx: idx });
      history.replaceState(st, '');
    }
  }

  // ── Render initial du contenu ──
  currentCard.innerHTML = buildCardHTML(byId(ids[app.detailIdx]));
  syncUI(app.detailIdx);
  _chordDetailNav = false;

  // ── Navigation avec stack animation ──
  var animating = false;
  function navigateTo(newIdx, dir){
    if (animating) return;
    if (newIdx < 0 || newIdx >= ids.length) return;
    animating = true;

    app.detailIdx = newIdx;
    var c = byId(ids[newIdx]);

    // Nouvelle carte insérée derrière (grid stacking — pas d'absolute)
    var newCard = document.createElement('div');
    newCard.className = 'detail-card behind';
    newCard.innerHTML = buildCardHTML(c);
    stack.insertBefore(newCard, currentCard);

    // Carte courante : monte en couche supérieure et part hors-cadre
    currentCard.classList.remove('popin');
    currentCard.classList.add('front-anim');
    void currentCard.offsetWidth; // reflow
    currentCard.classList.add(dir > 0 ? 'fly-out-left' : 'fly-out-right');

    // Nouvelle carte : se met au premier plan
    newCard.classList.remove('behind');
    newCard.classList.add('coming-in');

    syncUI(newIdx);

    var oldCard = currentCard;
    currentCard = newCard;

    setTimeout(function(){
      oldCard.remove();
      currentCard.classList.remove('coming-in');
      animating = false;
    }, 460);
  }

  function goPrev(){ navigateTo(app.detailIdx - 1, -1); }
  function goNext(){ navigateTo(app.detailIdx + 1,  1); }

  // Swipe gestures
  var touchStartX = 0, touchStartY = 0, touchActive = false;
  stack.addEventListener('touchstart', function(e){
    if (animating) return;
    var t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY; touchActive = true;
  }, { passive: true });
  stack.addEventListener('touchend', function(e){
    if(!touchActive) return;
    touchActive = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) goNext();
      else        goPrev();
    }
  }, { passive: true });

  document.getElementById('dBack').onclick=function(){ navBack(); };
  bPrev.onclick = goPrev;
  bNext.onclick = goNext;
}

function obPlaceTip(){
  var spot=document.getElementById('obSpot'), tip=document.getElementById('obTip');
  if(!spot||!_obTour[_obIdx]) return;
  var el=document.querySelector(_obTour[_obIdx].sel); if(!el) return;
  var r=el.getBoundingClientRect(), pad=8;
  spot.style.left=(r.left-pad)+'px'; spot.style.top=(r.top-pad)+'px';
  spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';
  if(tip){
    var th=tip.offsetHeight, tw=tip.offsetWidth, vh=window.innerHeight, vw=window.innerWidth;
    var top=r.bottom+pad+10; if(top+th>vh-10) top=r.top-pad-10-th; if(top<10) top=10;
    var left=r.left+r.width/2-tw/2; if(left<14) left=14; if(left+tw>vw-14) left=vw-14-tw;
    tip.style.top=top+'px'; tip.style.left=left+'px';
  }

    o.type='sine'; o.frequency.value=p[1];
    g.gain.setValueAtTime(0.0001,t+p[0]);
    g.gain.exponentialRampToValueAtTime(0.22,t+p[0]+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+p[0]+0.20);
    o.connect(g); g.connect(_tCtx.destination); o.start(t+p[0]); o.stop(t+p[0]+0.22);
  });
}catch(e){} }
function tValidate(name){
  var now=performance.now();
  var firstTime=!_tValidated[name];
  _tValidated[name]=true;
  var chip=document.getElementById('tchip-'+name); if(chip) chip.className='tuner-chip done';
  var st=document.getElementById('tunerCents'); if(st){ st.textContent='✓ '+tStringLabel(name)+' accordé !'; st.className='tuner-cents ok'; }
  var last=_tSndTime[name]||0;
  // Re-son : 1re fois, OU (silence depuis le dernier son ET >= 4 s pour CETTE corde)
  if(firstTime || (_tSilenceSeen && (now-last)>=4000)){
    tChime(); tVibrate([40,30,40]); _tSndTime[name]=now; _tSilenceSeen=false;
  }
  if(firstTime){
    var all=TUNER_STRINGS.every(function(x){ return _tValidated[x.name]; });
    if(all){ var h=document.getElementById('tunerHint'); if(h) h.innerHTML='🎉 <b style="font-size:18px">Ukulélé accordé !</b>'; }
  }
}

  var ov=document.createElement('div'); ov.className='tuner-overlay'; ov.id='tunerOverlay';
  ov.innerHTML='<div class="tuner-panel">'+

    '<div class="tuner-kicker">Accordeur</div>'+

    '<div class="tuner-hint" id="tunerHint">Autorise le micro, puis joue une corde à vide.</div>'+
    '<button class="tuner-reset" id="tunerResetBtn">↺ Réinitialiser</button>'+
  '</div>';
  document.body.appendChild(ov);
  var sc=document.getElementById('tunerStrings');

function tunerStart(){
  var hint=document.getElementById('tunerHint'), startBtn=document.getElementById('tunerStartBtn');
  var md=navigator.mediaDevices;
  var legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
  var gum=(md&&md.getUserMedia)?function(c){return md.getUserMedia(c);}
         :legacy?function(c){return new Promise(function(res,rej){legacy.call(navigator,c,res,rej);});}
         :null;
  if(!gum){
    var secure=(window.isSecureContext!==false);
    if(hint) hint.textContent=secure?'Micro non disponible : ce navigateur ne supporte pas l\'accès micro (getUserMedia).':'Micro bloqué : la page doit être en HTTPS.';
    return;
  }
  if(hint) hint.textContent='Autorisation micro en attente…';
  function onOK(stream){
    _tStream=stream;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){ if(hint) hint.textContent='Web Audio non supporté sur ce navigateur.'; if(startBtn) startBtn.style.display=''; try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){} return; }
    _tCtx=new AC();
    if(_tCtx.state==='suspended'){ try{ _tCtx.resume(); }catch(e){} }
    var src=_tCtx.createMediaStreamSource(stream);
    _tAnalyser=_tCtx.createAnalyser(); _tAnalyser.fftSize=2048;
    src.connect(_tAnalyser);
    _tBuf=new Float32Array(_tAnalyser.fftSize);
    _tRun=true;
    if(startBtn) startBtn.style.display='none';
    if(hint) hint.textContent='Joue une corde à vide (G, C, E ou A).';
    tunerLoop();
  }
  function onErr(err){
    var name=(err&&err.name)||'Erreur', msg=(err&&err.message)||'';
    if(name==='NotAllowedError'||name==='SecurityError'||name==='PermissionDeniedError'){ tunerShowPermHelp(); return; }
    var tip='';
    if(name==='NotFoundError'||name==='OverconstrainedError') tip=' — aucun micro détecté par le navigateur.';
    else if(name==='NotReadableError') tip=' — le micro est utilisé par une autre application. Ferme-la et réessaie.';
    if(hint) hint.innerHTML='⚠️ '+name+(msg?' : '+msg:'')+tip;
    if(startBtn) startBtn.style.display='';
  }
    gum({audio:{echoCancellation:false,autoGainControl:false,noiseSuppression:false},video:false})
    .then(onOK)
    .catch(function(){ gum({audio:true,video:false}).then(onOK).catch(onErr); });
}
function tPlayRef(midi,name){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!_tCtx){ _tCtx=new AC(); }
    var ctx=_tCtx;
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    var f=tNoteFreq(midi), t0=ctx.currentTime, dur=3.0;
    var master=ctx.createGain();
    master.gain.setValueAtTime(0.0001,t0);
    master.gain.exponentialRampToValueAtTime(0.32,t0+0.04);
    master.gain.setValueAtTime(0.32,t0+0.6);
    master.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    master.connect(ctx.destination);
    [[f,1,'sine'],[f*2,0.16,'sine'],[f*3,0.06,'triangle']].forEach(function(pp){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type=pp[2]; o.frequency.value=pp[0]; g.gain.value=pp[1];
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.05);
    });
    _tRefUntil=performance.now()+(dur*1000)+120;
    _tHist.length=0; _tInTuneSince=0; _tLockedName=null; _tLastName=''; _tStickName=''; _tSwitchCand=''; _tSwitchCount=0;
    var nz=document.getElementById('tunerCentsNum'); if(nz){ nz.textContent=''; nz.className='tuner-centsnum'; }
    var c=document.getElementById('tunerCents'); if(c){ c.innerHTML='🔊 Note de référence : <b>'+name+'</b> ('+tStringLabel(name)+')'; c.className='tuner-cents'; }
    var nEl=document.getElementById('tunerNote'); if(nEl){ nEl.textContent=name; nEl.className='tuner-note'; }
  }catch(e){}
}
function tunerLoop(){
  if(!_tRun) return;
  if(_tRefUntil && performance.now()<_tRefUntil){ _tRAF=requestAnimationFrame(tunerLoop); return; }
  _tAnalyser.getFloatTimeDomainData(_tBuf);
  var f=tAutoCorrelate(_tBuf,_tCtx.sampleRate);
  var now=performance.now();
  if(tRMS(_tBuf)<0.004) _tSilenceSeen=true; // silence total -> ré-arme le re-son
  var noteEl=document.getElementById('tunerNote'), centsEl=document.getElementById('tunerCents'),
      freqEl=document.getElementById('tunerFreq'), needle=document.getElementById('tunerNeedle');
  if(f>110 && f<700){
    _tHist.push(f); if(_tHist.length>8) _tHist.shift();
    _tLastGood=now;
    var mf=tMedian(_tHist);
    var near=tNearestString(mf), rawName=near.s.name;
    // « Stickiness » de corde (TOUTES les cordes) : une fois sur une corde, rejette les sauts brefs vers une autre
    // (ex. faux A pendant le E), et ne bascule qu'après ~6 trames cohérentes (~100 ms) pour passer à la suivante.
    if(!_tStickName){ _tStickName=rawName; _tSwitchCand=''; _tSwitchCount=0; }
    if(rawName!==_tStickName){
      if(rawName===_tSwitchCand) _tSwitchCount++; else { _tSwitchCand=rawName; _tSwitchCount=1; }
      if(_tSwitchCount>=6){ _tStickName=rawName; _tSwitchCand=''; _tSwitchCount=0; }
      else { _tRAF=requestAnimationFrame(tunerLoop); return; }
    } else { _tSwitchCand=''; _tSwitchCount=0; }
    var name=_tStickName, rawCents=near.cents;
    if(name!==_tLastName || _tDispCents===null) _tDispCents=rawCents; else _tDispCents += (rawCents-_tDispCents)*0.18;
    var cents=Math.round(_tDispCents), tuned=Math.abs(_tDispCents)<=3;
    var numEl=document.getElementById('tunerCentsNum');
    if(noteEl){ noteEl.textContent=name; noteEl.className='tuner-note'+(tuned?' ok':''); }
    TUNER_STRINGS.forEach(function(x){ var ch=document.getElementById('tchip-'+x.name); if(!ch) return; if(_tValidated[x.name]) ch.className='tuner-chip done'; else ch.className='tuner-chip'+(x.name===name?' active':''); });
    if(needle){ needle.setAttribute('transform','rotate('+tNeedleAngle(_tDispCents)+' 100 108)'); needle.setAttribute('class','t-needle'+(tuned?' ok':'')); }
    if(_tLockedName!==name){
      if(numEl){ numEl.textContent=(cents>0?'+':'')+cents+' ¢'; numEl.className='tuner-centsnum'; }
      if(centsEl){ if(tuned){ centsEl.innerHTML='juste, <b>laisser sonner…</b>'; centsEl.className='tuner-cents ok'; } else if(cents>0){ centsEl.innerHTML='<b style="color:#D0342C">trop aigu</b>'; centsEl.className='tuner-cents'; } else { centsEl.innerHTML='<b style="color:#E8821E">trop grave</b>'; centsEl.className='tuner-cents'; } }
    }
    if(freqEl) freqEl.textContent=mf.toFixed(1)+' Hz';
    if(tuned && name===_tLastName){
      if(!_tInTuneSince) _tInTuneSince=now;
      else if(now-_tInTuneSince>=700 && _tLockedName!==name){ _tLockedName=name; tValidate(name); }
    } else { _tInTuneSince=0; _tLockedName=null; }
    _tLastName=name;
  } else if(now-_tLastGood<600){
    /* grâce : micro-coupure, on garde l'affichage et le compteur de verrouillage */
  } else {
    _tHist.length=0; _tInTuneSince=0; _tLockedName=null; _tLastName=''; _tDispCents=null; _tStickName=''; _tSwitchCand=''; _tSwitchCount=0;
    if(noteEl){ noteEl.textContent='–'; noteEl.className='tuner-note'; }
    if(needle){ needle.setAttribute('transform','rotate(0 100 108)'); needle.setAttribute('class','t-needle'); }
    var nEl2=document.getElementById('tunerCentsNum'); if(nEl2){ nEl2.textContent=''; nEl2.className='tuner-centsnum'; }
    var anyDone=TUNER_STRINGS.some(function(x){return _tValidated[x.name];});
    if(centsEl && !anyDone){ centsEl.textContent='Joue une corde…'; centsEl.className='tuner-cents'; }
  }
  _tRAF=requestAnimationFrame(tunerLoop);
}
function tunerReset(){

/* ════════════════════════════════════════════════════════════
   SERVICE WORKER + DÉTECTION MISE À JOUR
   - Popup centrée bloquante, sans dismiss
   - Affichée uniquement sur l'accueil (jamais pendant une session)
   - Si update détectée pendant une session : attend le retour à l'accueil
════════════════════════════════════════════════════════════ */
var _updatePending  = false;
var _updateShown    = false;
var _reloading      = false;
var _hadController   = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

function _doReload(){ if (_reloading) return; _reloading = true; window.location.reload(); }

function showUpdatePopup() {
  if (_updateShown) return;
  _updateShown = true;
  var overlay = document.createElement('div');
  overlay.className = 'update-overlay';
  overlay.id = 'updateOverlay';
  overlay.innerHTML =
    '<div class="update-popup">'+
      '<div class="update-popup-icon">🪕</div>'+
      '<div class="update-popup-title">Nouvelle version disponible</div>'+
      '<div class="update-popup-body">Mise à jour prête — l\'app se recharge dans un instant…</div>'+
      '<button class="update-popup-btn" id="updateBtn">Actualiser maintenant</button>'+
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('updateBtn').onclick = _doReload;
  setTimeout(_doReload, 2500); // laisse 2,5 s pour lire la popup
}

// Affiche la popup seulement si une update est prête ET qu'on est sur l'accueil (jamais en pleine session)
function maybeShowUpdate() {
  if (_updatePending && !_updateShown && app.screen === 'home') {
    showUpdatePopup();
  }
}

if ('serviceWorker' in navigator) {
  function _checkUpdate(){ navigator.serviceWorker.getRegistration().then(function(reg){ if (reg) reg.update(); }).catch(function(){}); }
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg) {
      reg.update(); // vérifie une mise à jour dès le lancement
      reg.addEventListener('updatefound', function() {
        var newSW = reg.installing;
        if (!newSW) return;
        newSW.addEventListener('statechange', function() {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            _updatePending = true;
            maybeShowUpdate();
          }
        });
      });
    }).catch(function(){});
    // Re-check agressif : focus, retour a l'ecran (mobile), et toutes les 60 s
    window.addEventListener('focus', _checkUpdate);
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') _checkUpdate(); });
    setInterval(_checkUpdate, 60000);
  });

  // Le nouveau SW prend le controle (skipWaiting) -> programmer le reload, de preference sur l'accueil
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (!_hadController) return;   // 1er install : pas de reload
    _updatePending = true;
    maybeShowUpdate();             // popup + reload 2,5 s si on est sur l'accueil ; sinon a la prochaine visite de l'accueil
  });
}
